# Configuration Alembic.
#
# L'URL de la base n'est PAS écrite ici : elle est lue depuis
# app.config.settings (donc de l'environnement) par alembic/env.py.
# Un identifiant de production n'a rien à faire dans un fichier versionné.

[alembic]
script_location = alembic
prepend_sys_path = .
# Les révisions sont préfixées d'un numéro d'ordre, plus lisible qu'un
# hachage seul dans l'historique du dépôt.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
