services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Le port 5432 n'est PAS publié sur l'hôte : l'API joint la base par
    # le réseau interne de Compose. Le publier exposerait PostgreSQL à
    # Internet sur un serveur distant, et entrerait en conflit avec une
    # instance déjà installée sur la machine.
    # Pour inspecter la base depuis l'hôte, ajouter :
    #   ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://planner:planner@db:5432/planner
      # DEBUG=true : une SECRET_KEY éphémère est générée au démarrage.
      # En production, retirer DEBUG et fournir une vraie clé :
      #   SECRET_KEY: ${SECRET_KEY:?definir SECRET_KEY dans .env}
      DEBUG: "true"
      # Le navigateur joint l'API par le même hôte que l'interface, via
      # le relais nginx : l'origine est donc toujours celle du service
      # « web ». Aucune adresse publique à renseigner ici.
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      GENERATIONS_SIMULTANEES: "2"
      SOLVEUR_THREADS: "8"
    # Publié pour consulter /docs pendant le développement. En
    # production, cette ligne peut disparaître : l'interface joint
    # l'API par le relais nginx, sur le réseau interne de Compose.
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    working_dir: /app

  # L'application Flutter, compilée pour le web. La MÊME base de code
  # produit l'application Android et iOS : il n'y a qu'un frontend à
  # maintenir.
  #
  # CanvasKit et la police sont servis depuis cette image, pas depuis
  # un CDN : une école mal connectée doit voir la même interface qu'un
  # bureau en fibre, et l'application démarre sans accès à Internet.
  web:
    build:
      context: ./app
      args:
        # Chemin relatif : l'application appelle « /api », que nginx
        # relaie vers le service api. Rien à changer d'un serveur à
        # l'autre, et une seule image pour tous les déploiements.
        API_BASE: /api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
