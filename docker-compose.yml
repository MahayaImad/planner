services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://planner:planner@db:5432/planner
      # DEBUG=true : une SECRET_KEY éphémère est générée au démarrage.
      # En production, retirer DEBUG et fournir une vraie clé :
      #   SECRET_KEY: ${SECRET_KEY:?definir SECRET_KEY dans .env}
      DEBUG: "true"
      CORS_ORIGINS: http://localhost:5173
      GENERATIONS_SIMULTANEES: "2"
      SOLVEUR_THREADS: "8"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    working_dir: /app

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # Le proxy Vite utilise le nom du service Docker "api", pas localhost
      VITE_API_TARGET: http://api:8000

volumes:
  postgres_data:
