server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Application à page unique : toute route inconnue rend index.html,
    # sans quoi un rechargement sur /reglages tomberait sur un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # L'API passe par le même hôte et le même port que l'interface.
    #
    # Sans cela, l'adresse de l'API devrait être figée à la compilation
    # de l'image : « localhost:8000 » désignerait alors la machine du
    # VISITEUR, et il faudrait reconstruire l'image pour chaque domaine.
    # En relayant ici, la même image sert n'importe quel serveur.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une génération peut durer un quart d'heure ; le relevé
        # d'avancement ne doit pas être coupé entre-temps.
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;

        # Le classeur Excel téléversé peut peser quelques mégaoctets.
        client_max_body_size 16m;
    }

    # Le service worker ne doit jamais être servi depuis le cache :
    # sinon une mise à jour ne parvient jamais aux navigateurs.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Le reste porte une empreinte dans son nom : cache long sans risque.
    location ~* \.(js|wasm|css|png|jpg|svg|ttf|otf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm
               application/json image/svg+xml;
    gzip_min_length 1024;
}
