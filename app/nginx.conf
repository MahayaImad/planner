server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Application à page unique : toute route inconnue rend index.html,
    # sans quoi un rechargement sur /reglages tomberait sur un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le service worker ne doit jamais être servi depuis le cache :
    # sinon une mise à jour ne parvient jamais aux navigateurs.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Le reste porte une empreinte dans son nom : cache long sans risque.
    location ~* \.(js|wasm|css|png|jpg|svg|ttf|otf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm
               application/json image/svg+xml;
    gzip_min_length 1024;
}
